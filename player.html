<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xeneon YouTube Player</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #frame-wrap { position:fixed; inset:0; }
  iframe { width:100%; height:100%; border:0; display:block; }
  #status {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#888; font:600 20px/1.4 -apple-system, Segoe UI, sans-serif; text-align:center;
    background:#000; padding:0 24px;
  }
</style>
</head>
<body>
  <div id="status">Waiting for a video&hellip;</div>
  <div id="frame-wrap"></div>

<script>
// ---- config comes from the URL you paste into iCUE, e.g.:
// player.html?gist=YOUR_GIST_ID&token=YOUR_TOKEN&poll=15
const params = new URLSearchParams(location.search);
const GIST_ID = params.get('gist');
const TOKEN   = params.get('token') || '';
const POLL_MS = (parseInt(params.get('poll'), 10) || 15) * 1000;
const FILE_NAME = 'current.json';

let currentVideoId = null;

function setStatus(msg) {
  const s = document.getElementById('status');
  if (msg) { s.textContent = msg; s.style.display = 'flex'; }
  else { s.style.display = 'none'; }
}

function showVideo(videoId) {
  if (videoId === currentVideoId) return;
  currentVideoId = videoId;
  const wrap = document.getElementById('frame-wrap');
  wrap.innerHTML = '';
  if (!videoId) { setStatus('Waiting for a video…'); return; }
  setStatus(null);
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=1&playsinline=1&rel=0`;
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  wrap.appendChild(iframe);
}

async function poll() {
  if (!GIST_ID) { setStatus('No gist configured. Add ?gist=YOUR_GIST_ID to the widget URL.'); return; }
  try {
    const headers = TOKEN ? { Authorization: `token ${TOKEN}` } : {};
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers, cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const file = data.files && data.files[FILE_NAME];
    if (!file) throw new Error('current.json not found in gist');
    const parsed = JSON.parse(file.content);
    showVideo(parsed.videoId || null);
  } catch (err) {
    console.error('poll failed', err);
    if (!currentVideoId) setStatus('Could not reach the gist. Check the token/gist ID.');
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
